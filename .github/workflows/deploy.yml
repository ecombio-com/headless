name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one brand failing never stops the others
      matrix:
        # Add a brand here only at its launch step (docs/brand-launch.md, step 6)
        brand: [bicyclebio, skaterbio]
    environment: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12
      - run: pnpm install --frozen-lockfile
      - run: cp .env.${{ matrix.brand }} .env.production.local
      - run: pnpm exec opennextjs-cloudflare build --env ${{ matrix.brand }}
      - run: pnpm exec opennextjs-cloudflare deploy --env ${{ matrix.brand }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
